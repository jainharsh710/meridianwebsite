name: SEO engine (daily index check)

on:
  schedule:
    - cron: "30 3 * * *"         # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-engine-git
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: pip install -r automation/requirements.txt
      - name: Inspect recent posts in Search Console
        if: env.GSC_SA_JSON != ''
        run: python -m automation.run daily-index
      - name: Save
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "meridian-seo-engine"
          git config user.email "seo-engine@users.noreply.github.com"
          git add automation/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO engine: daily index status"
          git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
