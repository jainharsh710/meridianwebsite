name: SEO engine (weekly article)

on:
  schedule:
    - cron: "30 20 * * 0"        # Sunday 20:30 UTC = Monday 02:00 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write and email the article but don't publish it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seo-engine-git
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
      DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
      GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAX_RUN_USD: ${{ vars.MAX_RUN_USD }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      CALC_SANDBOX: strict
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install
        run: pip install -r automation/requirements.txt

      - name: Check secrets
        run: |
          missing=""
          for v in ANTHROPIC_API_KEY DATAFORSEO_LOGIN DATAFORSEO_PASSWORD GSC_SA_JSON RESEND_API_KEY REPORT_EMAIL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::warning::Missing secrets:$missing (the run continues with reduced features)"; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::ANTHROPIC_API_KEY is required"; exit 1; fi

      - name: Learn, plan, research, write, check, build
        id: prep
        run: python -m automation.run prepare

      - name: Commit and push the article
        id: push
        if: always() && steps.prep.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "meridian-seo-engine"
          git config user.email "seo-engine@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          msg_file="${{ steps.prep.outputs.run_dir }}/commit_message.txt"
          if [ -f "$msg_file" ]; then git commit -F "$msg_file"; else git commit -m "SEO engine: weekly run data"; fi
          if [ "$DRY_RUN" = "true" ]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "HEAD:refs/heads/seo-dry-run/$(date +%Y-%m-%d-%H%M)"
          else
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" main
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Confirm live, IndexNow, sitemap, publish email
        id: post
        if: steps.prep.outputs.publish_ready == 'true'
        run: python -m automation.run post-publish

      - name: Revert if the page never went live
        if: failure() && steps.post.outcome == 'failure' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git stash --include-untracked || true
          git revert --no-edit "${{ steps.push.outputs.sha }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main

      - name: Save run data
        if: success() && steps.prep.outputs.publish_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "SEO engine: post-publish data"
          if [ "$DRY_RUN" = "true" ]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "HEAD:refs/heads/seo-dry-run/$(date +%Y-%m-%d-%H%M)-data"
          else
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" main
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main
          fi
